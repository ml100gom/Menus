<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Hanken Grotesk",system-ui,sans-serif;padding-bottom:84px}
.hd{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 26px 26px;padding:20px 18px 24px}

.hd h1{margin:0;font:700 30px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.5px}
.hd p{margin:2px 0 0;opacity:.85}.hd p::first-letter{text-transform:uppercase}

button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px}

.dh{display:flex;gap:12px;align-items:center;margin-bottom:6px}

.now .dn{background:var(--ac);color:var(--onac)}
.dh b{text-transform:capitalize;font-size:17px}
.tag{font-size:12px;background:var(--ac);color:var(--onac);border-radius:999px;padding:1px 9px;margin-left:6px}
.slot{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px;border-left:4px solid var(--mid)}
.slot.soir{border-left-color:var(--soir)}
.lb{font-weight:700}
.meal{padding-top:8px;margin-top:6px;border-top:1px dashed var(--bd)}
.step{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:2px}
.step button{border:0;background:var(--ac2);color:var(--ac);border-radius:50%;width:30px;height:30px;padding:0;font-weight:700}
.it{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);padding:2px 0}.it b{padding:0 8px;cursor:pointer}
.l{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin:5px 0;padding:12px 14px}
.ok{color:var(--ok);font-size:13px}.no{color:var(--no);font-size:13px}
.chips{display:flex;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;background:var(--ac2);border-radius:999px;padding:4px 11px;margin:3px 5px 3px 0;font-size:14px}
.chip b{cursor:pointer;color:var(--no)}
.cat{border-top:1px solid var(--bd)}.cat .cat{margin-left:12px}
.tree{padding:4px 14px}.tree>.cat{border-top:0}
summary{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary em{font-style:normal;font-weight:400;font-size:13px;color:var(--mu);background:var(--bg);border-radius:999px;padding:1px 10px}
.cat[open]>summary{color:var(--ac)}

.ch{font:600 15px "Bricolage Grotesque",system-ui,sans-serif;color:var(--ac);margin:14px 0 2px}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-radius:14px;background:none;padding:6px 2px;font-size:12px;color:var(--mu)}
.tb button span{font-size:21px}
.tb button.on{background:var(--ac2);color:var(--ac);font-weight:600}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 14px calc(14px + env(safe-area-inset-bottom,0px));position:relative;animation:up .22s ease-out}
.sh::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--bd)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sh{animation:none}}

const SEED=[];SD.split("\n").forEach(l=>{const[p,r]=l.split("=");r.split(";").forEach(t=>{const[n,w,m]=t.trim().split("~");const o={p,n,w:+w||0};if(m!==undefined)o.m=m;SEED.push(o)})});
const ALL=()=>SEED.concat(S.ing);
const pw=n=>{if(S.pw[n])return S.pw[n];const i=ALL().find(i=>i.n===n);return i&&i.w||0};
const cat=n=>{const i=ALL().find(i=>i.n===n);return i?i.p.split("/")[0]:"Autres"};
const mo=new Date().getMonth()+1;
const inS=m=>{if(!m)return false;const[a,b]=m.split("-").map(Number);return a<=b?mo>=a&&mo<=b:mo>=a||mo<=b};
const badge=i=>typeof i.m==="string"?(inS(i.m)?'<span class="ok">● de saison</span>':'<span class="no">○ hors saison</span>'):"";
function sheet(){const o=document.createElement("div");o.className="ov";document.body.append(o);return{o,set(h){o.innerHTML='<div class="sh">'+h+'</div>'},close(){o.remove()}}}
async function out(text,title){try{if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e.name==="AbortError")return}try{await navigator.clipboard.writeText(text);alert("Copié dans le presse-papiers.")}catch(e){prompt("Copie le texte :",text)}}

function picker(cb){const w=sheet(),g=s=>w.o.querySelector(s);let path=[],q="",sel=null,msg="",subs=[],leaves=[],P="";
const draw=()=>{P=path.join("/");let h="";
 if(sel){const u0=pw(sel.n)?"pièce":/Laits|Huiles|Vinaigres|Boissons/.test(sel.p)?"cl":"g";
  h=`<div class="r"><b>${esc(sel.n)}</b><button class="mini" data-a="x">✕</button></div>${badge(sel)}<div class="r"><input id="q" type="number" min="0" step="any" value="1" inputmode="decimal"><select id="u">${["g","kg","cl","pièce","càs","càc"].map(u=>`<option${u===u0?" selected":""}>${u}</option>`).join("")}</select></div><label class="mu">Poids d’une pièce en g (facultatif)<input id="w" type="number" inputmode="decimal" value="${pw(sel.n)||""}"></label><div class="r"><button data-a="bk">‹ Retour</button><button class="pri" data-a="ok">Ajouter</button></div>`}
 else{subs=[];leaves=[];const all=ALL();
  if(q.trim()){const t=q.trim().toLowerCase();leaves=all.filter(i=>i.n.toLowerCase().includes(t)).slice(0,80)}
  else all.forEach(i=>{if(i.p===P)leaves.push(i);else if(!P||i.p.startsWith(P+"/")){const s=(P?i.p.slice(P.length+1):i.p).split("/")[0];if(!subs.includes(s))subs.push(s)}});
  h=`<div class="r"><b>${path.length?esc(path.join(" › ")):"Ingrédients"}</b><button class="mini" data-a="x">✕</button></div><input id="s" placeholder="Rechercher…" value="${esc(q)}">`+(path.length&&!q?`<button class="l" data-a="up">‹ Retour</button>`:"")+(msg?`<p class="ok">${esc(msg)}</p>`:"")+subs.map((s,k)=>`<button class="l" data-a="sub" data-i="${k}"><span>${path.length?"":ic(s)+" "}${esc(s)}</span><span>›</span></button>`).join("")+leaves.map((i,k)=>`<button class="l" data-a="lf" data-i="${k}"><span>${esc(i.n)}${q?`<br><small class="mu">${esc(i.p)}</small>`:""}</span>${badge(i)}</button>`).join("")+`<button class="l mu" data-a="new">+ Nouvel ingrédient ici</button>`}
 w.set(h)};
w.o.onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==="x")w.close();else if(a==="up"){path.pop();draw()}else if(a==="sub"){path.push(subs[i]);draw()}
 else if(a==="lf"){if(cb){sel=leaves[i];msg="";draw()}}else if(a==="bk"){sel=null;draw()}
 else if(a==="new"){const n=prompt("Nom du nouvel ingrédient");if(n){S.ing.push({p:P||"Mes ingrédients",n:n.trim(),w:0});save();draw()}}
 else if(a==="ok"){const qv=parseFloat(g("#q").value),wv=parseFloat(g("#w").value);if(!(qv>0))return;if(wv>0){S.pw[sel.n]=wv;save()}cb(sel.n,qv,g("#u").value);msg="✓ "+sel.n+" ajouté";sel=null;draw()}};
w.o.oninput=e=>{if(e.target.id==="s"){q=e.target.value;draw();const v=g("#s");v.focus();v.setSelectionRange(v.value.length,v.value.length)}};
draw()}

const meal=(k,i,m)=>`<div class="meal"><div class="r"><b>${esc(m.name)}</b><button class="mini" onclick="delM('${k}',${i})">Retirer</button></div><div class="r"><span class="mu">Nombre de personnes</span><span class="step"><button onclick="pp('${k}',${i},-1)">−</button><span>👥 ${m.p}</span><button onclick="pp('${k}',${i},1)">+</button></span></div>`+m.items.map((x,j)=>`<div class="it"><span>${f(x.q*m.p/m.bp)} ${x.u} ${esc(x.n)}</span><b onclick="delI('${k}',${i},${j})">×</b></div>`).join("")+`</div>`;
function vPlan(){const s=addD(today(),off*7),t=today();
let h=`<div class="nav"><button onclick="off--;R()">‹</button><div>${fd(s,{day:"numeric",month:"short"})} – ${fd(addD(s,6),{day:"numeric",month:"short"})}${off?`<a onclick="off=0;R()">Revenir à aujourd’hui</a>`:""}</div><button onclick="off++;R()">›</button></div>`;
for(let d=0;d<7;d++){const k=addD(s,d),ms=S.plan[k]||[];
 h+=`<section class="day${k<t?" past":""}${k===t?" now":""}"><div class="dh"><span class="dn">${fd(k,{day:"numeric"})}</span><div><b>${fd(k,{weekday:"long"})}</b>${k===t?`<span class="tag">aujourd’hui</span>`:""}<div class="mu">${fd(k,{month:"long",year:"numeric"})}</div></div></div>`;
 [["midi","☀️ Midi"],["soir","🌙 Soir"]].forEach(([sl,lb])=>{const L=ms.map((m,i)=>[m,i]).filter(([m])=>(m.s||"midi")===sl);
  h+=`<div class="slot ${sl}"><div class="r"><span class="lb">${lb}</span><span><button class="mini" onclick="addRec('${k}','${sl}')">+ Recette</button> <button class="mini" onclick="addIng('${k}','${sl}')">+ Ingrédients</button></span></div>`+(L.length?L.map(([m,i])=>meal(k,i,m)).join(""):`<div class="mu">Rien de prévu</div>`)+`</div>`});
 h+=`</section>`}
return h}
function pp(k,i,d){const m=S.plan[k][i];m.p=Math.max(1,m.p+d);save();R()}
function delM(k,i){S.plan[k].splice(i,1);save();R()}
function delI(k,i,j){const m=S.plan[k][i];m.items.splice(j,1);if(!m.r&&!m.items.length)S.plan[k].splice(i,1);save();R()}
function addRec(k,sl){if(!S.rec.length){alert("Crée d’abord une recette dans l’onglet Recettes.");return}
 const w=sheet();w.set(`<div class="r"><b>Choisir une recette</b><button class="mini" data-a="x">✕</button></div>`+S.rec.map((r,i)=>`<button class="l" data-i="${i}"><span>${esc(r.name)}</span><span class="mu">${r.p} pers.</span></button>`).join(""));
 w.o.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.a==="x"){w.close();return}const r=S.rec[+b.dataset.i];(S.plan[k]=S.plan[k]||[]).push({name:r.name,s:sl,bp:r.p,p:r.p,r:1,items:JSON.parse(JSON.stringify(r.items))});save();w.close();R()}}
function addIng(k,sl){picker((n,q,u)=>{const ms=S.plan[k]=S.plan[k]||[];let m=ms.find(x=>!x.r&&(x.s||"midi")===sl);if(!m){m={name:"Repas composé",s:sl,bp:2,p:2,items:[]};ms.push(m)}m.items.push({n,q:q*m.bp/m.p,u});save();R()})}

function vRec(){let h=`<button class="pri" onclick="editR(-1)" style="width:100%;margin-top:12px">+ Nouvelle recette</button>`;
S.rec.forEach((r,i)=>h+=`<div class="card"><div class="r"><b>${esc(r.name)}</b><span class="mu">👥 ${r.p}</span></div><div class="mu">${r.items.map(t=>f(t.q)+" "+t.u+" "+esc(t.n)).join(", ")}</div><div class="r"><button class="mini" onclick="editR(${i})">Modifier</button><button class="mini" onclick="delR(${i})">Supprimer</button></div></div>`);
return h+(S.rec.length?"":`<p class="mu">Aucune recette pour l’instant.</p>`)}
function delR(i){if(confirm("Supprimer cette recette ?")){S.rec.splice(i,1);save();R()}}
function editR(i){E=i<0?{name:"",p:2,items:[],steps:""}:JSON.parse(JSON.stringify(S.rec[i]));E.i=i;if(!ew)ew=sheet();drawE()}
function drawE(){ew.set(`<div class="r"><b>Recette</b><button class="mini" onclick="closeE()">✕</button></div><input placeholder="Nom de la recette" value="${esc(E.name)}" oninput="E.name=this.value"><label class="mu">Nombre de personnes<input type="number" min="1" value="${E.p}" oninput="E.p=Math.max(1,+this.value||1)"></label><p><b>Ingrédients</b></p>`+E.items.map((t,k)=>`<div class="r"><span>${f(t.q)} ${t.u} ${esc(t.n)}</span><button class="mini" onclick="E.items.splice(${k},1);drawE()">×</button></div>`).join("")+`<button onclick="picker((n,q,u)=>{E.items.push({n,q,u});drawE()})">+ Ingrédient</button><p><b>Déroulé</b></p><textarea placeholder="Étape par étape…" oninput="E.steps=this.value">${esc(E.steps)}</textarea><div class="r"><button onclick="closeE()">Annuler</button><button class="pri" onclick="saveE()">Enregistrer</button></div>`)}
function closeE(){ew.close();ew=null}
function saveE(){if(!E.name.trim()){alert("Donne un nom à la recette.");return}const i=E.i;delete E.i;if(i<0)S.rec.push(E);else S.rec[i]=E;save();closeE();R()}

function agg(from,to,day){const m={},t=today();
Object.keys(S.plan).sort().forEach(k=>{if(k<t||k<from||k>to||(day!=="all"&&k!==day))return;
 S.plan[k].forEach(ml=>ml.items.forEach(x=>{let q=x.q*ml.p/ml.bp,u=x.u;if(u==="kg"){q*=1000;u="g"}if(u==="pièce"&&pw(x.n)){q*=pw(x.n);u="g"}const key=x.n+"|"+u;m[key]=m[key]||{n:x.n,u,q:0,key};m[key].q+=q}))});
return Object.values(m).sort((a,b)=>cat(a.n).localeCompare(cat(b.n),"fr")||a.n.localeCompare(b.n,"fr"))}
function fq(r){if(r.u!=="g")return f(r.q)+" "+(r.u==="pièce"?"pièce(s)":r.u);let s=r.q>=1000?f(r.q/1000)+" kg":f(r.q)+" g";const w=pw(r.n);if(w)s+=" ≈ "+Math.max(1,Math.ceil(r.q/w-0.1))+" pièce(s)";return s}
function vCour(){const t=today();if(!C.from||C.from<t)C.from=t;if(!C.to||C.to<C.from)C.to=addD(C.from,6);
const days=Object.keys(S.plan).filter(k=>k>=C.from&&k<=C.to&&k>=t&&S.plan[k].length).sort();if(C.day!=="all"&&!days.includes(C.day))C.day="all";
C.L=agg(C.from,C.to,C.day);let last="";
return `<div class="card"><div class="r"><label class="mu">Du<input type="date" min="${t}" value="${C.from}" onchange="C.from=this.value||today();R()"></label><label class="mu">Au<input type="date" min="${t}" value="${C.to}" onchange="C.to=this.value||C.from;R()"></label></div><select onchange="C.day=this.value;R()"><option value="all">Toute la période</option>${days.map(k=>`<option value="${k}"${C.day===k?" selected":""}>${fd(k,{weekday:"long",day:"numeric",month:"long"})}</option>`).join("")}</select><p class="mu">Les jours passés ne sont pas pris en compte.</p></div>`+
(C.L.length?`<div class="card">`+C.L.map(r=>{const c=cat(r.n),hd=c!==last?(last=c,`<div class="ch">${ic(c)} ${esc(c)}</div>`):"";return hd+`<label class="r"><span><input type="checkbox" data-k="${esc(r.key)}" ${C.chk[r.key]===false?"":"checked"} onchange="C.chk[this.dataset.k]=this.checked">${esc(r.n)}</span><span class="mu">${fq(r)}</span></label>`}).join("")+`</div><button class="pri" style="width:100%" onclick="exportL()">Exporter la sélection</button>`:`<p class="mu">Ajoute des repas dans le planning : la liste se construit à partir d’aujourd’hui.</p>`)}
function exportL(){const rows=C.L.filter(r=>C.chk[r.key]!==false);if(!rows.length)return;let last="",tx="Liste de courses"+(C.day==="all"?" ("+fd(C.from,{day:"numeric",month:"short"})+" – "+fd(C.to,{day:"numeric",month:"short"})+")":" ("+fd(C.day,{weekday:"long",day:"numeric",month:"long"})+")");
rows.forEach(r=>{const c=cat(r.n);if(c!==last){last=c;tx+="\n\n"+c}tx+="\n• "+r.n+" : "+fq(r)});out(tx,"Liste de courses")}

const MOIS=`<option value="">—</option>`+["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."].map((m,i)=>`<option value="${i+1}">${m}</option>`).join("");
function addForm(p0){const w=sheet(),g=s=>w.o.querySelector(s),paths=[...new Set([p0,...ALL().map(i=>i.p)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
w.set(`<div class="r"><b>Nouvel ingrédient</b><button class="mini" data-a="x">✕</button></div><label class="mu">Nom<input id="fn" placeholder="ex. Côte de bœuf maturée"></label><label class="mu">Catégorie<select id="fp">${paths.map(p=>`<option${p===p0?" selected":""}>${esc(p)}</option>`).join("")}<option value="+">➕ Nouvelle catégorie…</option></select></label><input id="fnp" placeholder="Nouvelle catégorie (ex. Légumes/Racines)" hidden><label class="mu">Poids d’une pièce en g (facultatif)<input id="fw" type="number" inputmode="decimal"></label><div class="r"><label class="mu">Saison : du<select id="fa">${MOIS}</select></label><label class="mu">au<select id="fb">${MOIS}</select></label></div><button class="pri" style="width:100%" data-a="ok">Ajouter</button>`);
w.o.onchange=e=>{if(e.target.id==="fp")g("#fnp").hidden=e.target.value!=="+"};
w.o.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.a==="x"){w.close();return}
 const n=g("#fn").value.trim(),sp=g("#fp").value,p=(sp==="+"?g("#fnp").value:sp).trim().replace(/\s*\/\s*/g,"/").replace(/^\/|\/$/g,"");
 if(!n||!p){alert("Renseigne le nom et la catégorie.");return}
 const o={p,n,w:parseFloat(g("#fw").value)||0},a=g("#fa").value,z=g("#fb").value;if(a&&z)o.m=a+"-"+z;
 S.ing.push(o);let acc="";p.split("/").forEach(s=>{acc=acc?acc+"/"+s:s;OPEN.add(acc)});save();w.close();R()}}
function delIng(i){if(confirm("Supprimer « "+S.ing[i].n+" » ?")){S.ing.splice(i,1);save();R()}}
function vBase(){const root={c:{},it:[]};
ALL().forEach(i=>{let n=root;i.p.split("/").forEach(s=>{n=n.c[s]=n.c[s]||{c:{},it:[]}});n.it.push(i)});
const cnt=n=>n.it.length+Object.values(n.c).reduce((a,x)=>a+cnt(x),0);
const chip=i=>`<span class="chip">${esc(i.n)}${typeof i.m==="string"?(inS(i.m)?" 🟢":" ⚪"):""}${S.ing.includes(i)?`<b onclick="delIng(${S.ing.indexOf(i)})">×</b>`:""}</span>`;
const rn=(name,n,path,d)=>`<details class="cat" data-p="${esc(path)}" ${OPEN.has(path)?"open":""} ontoggle="this.open?OPEN.add(this.dataset.p):OPEN.delete(this.dataset.p)"><summary><span>${d?"":ic(name)+" "}${esc(name)}</span><em>${cnt(n)}</em></summary>${Object.entries(n.c).map(([k,v])=>rn(k,v,path+"/"+k,d+1)).join("")}<div class="chips">${n.it.map(chip).join("")}</div><button class="mini add" data-p="${esc(path)}" onclick="addForm(this.dataset.p)">+ Ajouter ici</button></details>`;
const sea=SEED.filter(i=>typeof i.m==="string"&&/^(Fruits|Légumes)/.test(i.p)&&inS(i.m)),q=BQ.trim().toLowerCase(),res=q?ALL().filter(i=>i.n.toLowerCase().includes(q)).slice(0,100):[];
return `<div class="card"><b>🟢 De saison en ce moment</b><div class="chips">${sea.map(i=>`<span class="chip">${esc(i.n)}</span>`).join("")}</div></div><div class="card"><div class="r"><b>${ALL().length} ingrédients</b><button class="mini pri" onclick="addForm('')">+ Ajouter</button></div><input placeholder="Rechercher…" value="${esc(BQ)}" onchange="BQ=this.value;R()">${q?(res.length?res.map(i=>`<div class="r"><span>${esc(i.n)}</span><span class="mu">${esc(i.p)}</span></div>`).join(""):`<p class="mu">Aucun résultat.</p>`):""}</div>`+
(q?"":Object.entries(root.c).map(([k,v])=>`<div class="card tree">${rn(k,v,k,0)}</div>`).join(""))+
`<div class="card"><b>Sauvegarde</b><p class="mu">Les données restent sur cet appareil, historique des semaines compris. Exporte-les pour les copier ailleurs.</p><div class="r"><button onclick="bak()">Exporter</button><button onclick="rest()">Importer</button></div></div>`}
function bak(){out(JSON.stringify({rec:S.rec,plan:S.plan,ing:S.ing,pw:S.pw}),"Sauvegarde menus")}
function rest(){const t=prompt("Colle ici la sauvegarde :");if(!t)return;try{Object.assign(S,JSON.parse(t));save();R()}catch(e){alert("Sauvegarde illisible.")}}

function R(){$("#dt").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});$("#app").innerHTML={plan:vPlan,rec:vRec,cour:vCour,base:vBase}[tab]();document.querySelectorAll(".tb button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab))}
R();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#0d5c4a");g.addColorStop(1,"#1f9674");x.fillStyle=g;x.fillRect(0,0,180,180);x.font="100px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🥕",90,98);const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.append(l)}catch(e){}
</script></body></html>
